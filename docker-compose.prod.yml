name: restore-system

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Server=sql,1433;Database=RestoreSystem;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      ConnectionStrings__Redis: redis:6379
      Elasticsearch__NodeUri: http://elasticsearch:9200
      Elasticsearch__IndexPrefix: restore-logs
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost}
      EmailSettings__SiteUrl: ${PUBLIC_ORIGIN:-http://localhost}
      JWT__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      JWT__Issuer: ${JWT_ISSUER:-RestoreAPI}
      JWT__Audience: ${JWT_AUDIENCE:-RestoreClient}
      SepaySettings__BankAccountNumber: ${SEPAY_BANK_ACCOUNT_NUMBER:-}
      SepaySettings__BankName: ${SEPAY_BANK_NAME:-}
      SepaySettings__AccountHolder: ${SEPAY_ACCOUNT_HOLDER:-}
      SepaySettings__WebhookApiKey: ${SEPAY_WEBHOOK_API_KEY:-}
      CloudinarySettings__CloudName: ${CLOUDINARY_CLOUD_NAME:-placeholder}
      CloudinarySettings__ApiKey: ${CLOUDINARY_API_KEY:-placeholder}
      CloudinarySettings__ApiSecret: ${CLOUDINARY_API_SECRET:-placeholder}
      EmailSettings__SmtpServer: ${SMTP_SERVER:-smtp.gmail.com}
      EmailSettings__Port: ${SMTP_PORT:-587}
      EmailSettings__SenderEmail: ${SMTP_SENDER_EMAIL:-}
      EmailSettings__SenderName: ${SMTP_SENDER_NAME:-Restore System}
      EmailSettings__Username: ${SMTP_USERNAME:-}
      EmailSettings__Password: ${SMTP_PASSWORD:-}
      EmailSettings__EnableSsl: ${SMTP_ENABLE_SSL:-true}
    depends_on:
      sql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Client/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    profiles: ["observability"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sql_data:
  redis_data:
  elasticsearch_data:
